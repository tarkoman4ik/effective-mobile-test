spring:
  application:
    name: effective-mobile-test

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/migration/db.changelog-master.yaml

  datasource:
    url: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB}
    username: ${PG_USER}
    password: ${PG_PASS}
    driver-class-name: org.postgresql.Driver

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY}

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION_TIME}

server:
  port: ${APP_PORT}

logging:
  level:
    org:
      springframework:
        security: INFO
    com:
      example:
        bankcards:
          security: INFO